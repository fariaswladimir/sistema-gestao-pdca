services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gestao
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gestao_dev}
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
    volumes: ["./infra/keycloak:/opt/keycloak/data/import"]
    ports: ["8080:8080"]
  api:
    build: ./backend
    env_file: .env
    depends_on: [db, keycloak]
    ports: ["8000:8000"]
  worker:
    build: ./backend
    command: python -m app.motor.worker
    env_file: .env
    depends_on: [db]
  web:
    build: ./frontend
    env_file: .env
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  dbdata:
