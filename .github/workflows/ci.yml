name: ci
on:
  pull_request:
  push:
    branches: [main, "fatia/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_DB: gestao_test, POSTGRES_USER: gestao, POSTGRES_PASSWORD: gestao}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gestao -d gestao_test"
          --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://gestao:gestao@localhost:5432/gestao_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/restricoes.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -c backend/restricoes.txt -e "backend[dev]"
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: make check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Subir o ambiente (compose)
        shell: bash # -eo pipefail: o `| tee` não esconde a falha do compose
        run: |
          cp .env.example .env
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> .env
          echo "APP_VERSION=${GITHUB_SHA::12}" >> .env
          docker compose version
          docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee compose-up.log
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.seed
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env: {CI: "1"}
      - name: Diagnóstico como anotação (legível sem login)
        if: failure()
        run: |
          {
            echo "== compose up (fim) =="; tail -n 25 compose-up.log 2>/dev/null
            echo "== ps =="; docker compose ps -a
            for s in db keycloak api worker web; do echo "== $s =="; docker compose logs --no-color --tail 15 "$s" 2>&1 | cut -c1-220; done
          } > diagnostico.txt
          echo "::error title=diagnostico-e2e::$(sed 's/%/%25/g' diagnostico.txt | awk 'BEGIN{ORS="%0A"}1')"
          docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-falha
          path: |
            frontend/playwright-report
            frontend/test-results
            compose.log
            compose-up.log
          retention-days: 7

  publicar:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        imagem: [{nome: api, contexto: backend}, {nome: web, contexto: frontend}]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.imagem.contexto }}
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.imagem.nome }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.imagem.nome }}:main

  # TODO(T16): deploy-homologacao em runner self-hosted no servidor interno
  # (docker compose pull && up -d && alembic upgrade head && conferir /saude).
  # Depende de: VM com Docker, nome interno e certificado HTTPS.
