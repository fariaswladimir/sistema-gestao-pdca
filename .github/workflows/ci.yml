name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_DB: gestao_test, POSTGRES_USER: gestao, POSTGRES_PASSWORD: gestao}
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install -e "backend[dev]"
      - run: cd frontend && npm ci
      - run: make check
      - run: make e2e
  deploy-homologacao:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Definir na F00 (questão em aberto sobre hospedagem)"
