<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo das telas · Gestão PDCA</title>
<style>
/* Mesmos tokens de frontend/app/globals.css (referência: método do Atlassian Design System). */
:root {
  --ds-texto:#1f2733; --ds-texto-sutil:#4a5565; --ds-texto-mais-sutil:#6b7585; --ds-texto-inverso:#fff; --ds-link:#1d5fd6;
  --ds-fundo-pagina:#f7f8f9; --ds-superficie:#fff; --ds-superficie-elevada:#fff; --ds-fundo-neutro:#eef0f3;
  --ds-fundo-neutro-hover:#e2e5ea; --ds-fundo-marca:#1d5fd6; --ds-fundo-marca-hover:#174eb3; --ds-fundo-selecionado:#e8f0fd;
  --ds-borda:#d5d9e0; --ds-borda-forte:#8a93a3; --ds-borda-foco:#3b7cf0;
  --ds-sucesso-fundo:#ddf4e6; --ds-sucesso-texto:#1b6b3c; --ds-sucesso-borda:#2f9a5a;
  --ds-alerta-fundo:#fff1cc; --ds-alerta-texto:#7a4e00; --ds-alerta-borda:#d69a00;
  --ds-perigo-fundo:#fde3e1; --ds-perigo-texto:#a12a1f; --ds-perigo-borda:#d9473a;
  --ds-info-fundo:#e3edfd; --ds-info-texto:#1a4fa8; --ds-info-borda:#3b7cf0;
  --ds-neutro-fundo:#eef0f3; --ds-neutro-texto:#3e4757; --ds-neutro-borda:#8a93a3;
  --ds-descoberta-fundo:#efe6fc; --ds-descoberta-texto:#5b2fa3;
  --ds-sombra-elevada:0 1px 1px rgb(23 30 41/.12),0 0 1px rgb(23 30 41/.24);
  --ds-sombra-sobreposta:0 8px 12px rgb(23 30 41/.15),0 0 1px rgb(23 30 41/.3);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ds-texto:#dfe3ea; --ds-texto-sutil:#aeb6c3; --ds-texto-mais-sutil:#8a93a3; --ds-texto-inverso:#10141a; --ds-link:#7aa7f5;
    --ds-fundo-pagina:#15191f; --ds-superficie:#1d222a; --ds-superficie-elevada:#232933; --ds-fundo-neutro:#2b313b;
    --ds-fundo-neutro-hover:#353c48; --ds-fundo-marca:#6e9ff2; --ds-fundo-marca-hover:#8db3f5; --ds-fundo-selecionado:#1c2b45;
    --ds-borda:#39414d; --ds-borda-forte:#6b7585; --ds-borda-foco:#7aa7f5;
    --ds-sucesso-fundo:#163323; --ds-sucesso-texto:#8fdcab; --ds-sucesso-borda:#4cb377;
    --ds-alerta-fundo:#3a2c0b; --ds-alerta-texto:#f5cd6a; --ds-alerta-borda:#c99a20;
    --ds-perigo-fundo:#3f1c19; --ds-perigo-texto:#f7a89f; --ds-perigo-borda:#e0675b;
    --ds-info-fundo:#1c2b45; --ds-info-texto:#a9c6f8; --ds-info-borda:#6e9ff2;
    --ds-neutro-fundo:#2b313b; --ds-neutro-texto:#c3cad5; --ds-neutro-borda:#6b7585;
    --ds-descoberta-fundo:#2c2145; --ds-descoberta-texto:#cdb5f7;
    --ds-sombra-elevada:0 1px 1px rgb(0 0 0/.5),0 0 1px rgb(0 0 0/.6);
    --ds-sombra-sobreposta:0 8px 12px rgb(0 0 0/.45),0 0 1px rgb(0 0 0/.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ds-texto:#dfe3ea; --ds-texto-sutil:#aeb6c3; --ds-texto-mais-sutil:#8a93a3; --ds-texto-inverso:#10141a; --ds-link:#7aa7f5;
  --ds-fundo-pagina:#15191f; --ds-superficie:#1d222a; --ds-superficie-elevada:#232933; --ds-fundo-neutro:#2b313b;
  --ds-fundo-neutro-hover:#353c48; --ds-fundo-marca:#6e9ff2; --ds-fundo-marca-hover:#8db3f5; --ds-fundo-selecionado:#1c2b45;
  --ds-borda:#39414d; --ds-borda-forte:#6b7585; --ds-borda-foco:#7aa7f5;
  --ds-sucesso-fundo:#163323; --ds-sucesso-texto:#8fdcab; --ds-sucesso-borda:#4cb377;
  --ds-alerta-fundo:#3a2c0b; --ds-alerta-texto:#f5cd6a; --ds-alerta-borda:#c99a20;
  --ds-perigo-fundo:#3f1c19; --ds-perigo-texto:#f7a89f; --ds-perigo-borda:#e0675b;
  --ds-info-fundo:#1c2b45; --ds-info-texto:#a9c6f8; --ds-info-borda:#6e9ff2;
  --ds-neutro-fundo:#2b313b; --ds-neutro-texto:#c3cad5; --ds-neutro-borda:#6b7585;
  --ds-descoberta-fundo:#2c2145; --ds-descoberta-texto:#cdb5f7;
  --ds-sombra-elevada:0 1px 1px rgb(0 0 0/.5),0 0 1px rgb(0 0 0/.6);
  --ds-sombra-sobreposta:0 8px 12px rgb(0 0 0/.45),0 0 1px rgb(0 0 0/.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--ds-fundo-pagina); color:var(--ds-texto);
  font:14px/20px ui-sans-serif,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",sans-serif; }
h1 { font-size:24px; line-height:28px; margin:0; font-weight:600; }
h2 { font-size:16px; line-height:20px; margin:0; font-weight:600; }
h3 { font-size:12px; line-height:16px; margin:0 0 8px; font-weight:600; color:var(--ds-texto-sutil); text-transform:none; }
p { margin:0; }
a { color:var(--ds-link); }
button, input, select, textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--ds-borda-foco); outline-offset:2px; }

.topo { position:sticky; top:0; z-index:5; height:56px; display:flex; align-items:center; gap:16px; padding:0 16px;
  background:var(--ds-superficie); border-bottom:1px solid var(--ds-borda); }
.topo .marca { font-weight:600; font-size:16px; white-space:nowrap; }
.topo .espaco { flex:1; }
.topo .quem { color:var(--ds-texto-sutil); white-space:nowrap; }
.quadro { display:grid; grid-template-columns:260px minmax(0,1fr); min-height:calc(100vh - 56px); }
nav.menu { border-right:1px solid var(--ds-borda); background:var(--ds-superficie); padding:12px 8px; overflow:auto;
  position:sticky; top:56px; height:calc(100vh - 56px); }
nav.menu .grupo { margin:12px 8px 4px; font-size:12px; font-weight:600; color:var(--ds-texto-mais-sutil); }
nav.menu a { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 8px; border-radius:4px;
  color:var(--ds-texto-sutil); text-decoration:none; }
nav.menu a:hover { background:var(--ds-fundo-neutro); color:var(--ds-texto); }
nav.menu a[aria-current="page"] { background:var(--ds-fundo-selecionado); color:var(--ds-link); font-weight:600; }
nav.menu a .ponto { width:8px; height:8px; border-radius:50%; background:var(--ds-borda); flex:none; }
nav.menu a .ponto.real { background:var(--ds-sucesso-borda); }
.seletor { display:none; }
main { padding:24px; max-width:1100px; width:100%; min-width:0; }
.cabeca { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:20px; }
.cabeca .sub { color:var(--ds-texto-sutil); margin-top:4px; }
.faixa { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; padding:8px 12px; border-radius:4px;
  background:var(--ds-fundo-neutro); color:var(--ds-texto-sutil); font-size:12px; line-height:16px; }

.cartao { background:var(--ds-superficie-elevada); border-radius:8px; box-shadow:var(--ds-sombra-elevada); padding:16px; }
.grade { display:grid; gap:16px; }
.g2 { grid-template-columns:repeat(2,minmax(0,1fr)); } .g3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
.g4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
.g2a { grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); } .g2b { grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); } .g2c { grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); }
.linha { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.entre { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start; justify-content:space-between; }
.sutil { color:var(--ds-texto-sutil); } .mais-sutil { color:var(--ds-texto-mais-sutil); }
.peq { font-size:12px; line-height:16px; }
.sep { border:0; border-top:1px solid var(--ds-borda); margin:16px 0; }
.mt { margin-top:16px; } .mt8 { margin-top:8px; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:4px; height:32px; padding:0 12px; border-radius:4px;
  border:0; font-weight:500; cursor:pointer; background:var(--ds-fundo-neutro); color:var(--ds-texto); white-space:nowrap; }
.btn:hover { background:var(--ds-fundo-neutro-hover); }
.btn.pri { background:var(--ds-fundo-marca); color:var(--ds-texto-inverso); } .btn.pri:hover { background:var(--ds-fundo-marca-hover); }
.btn.sut { background:transparent; color:var(--ds-texto-sutil); } .btn.sut:hover { background:var(--ds-fundo-neutro); }
.btn.per { background:var(--ds-perigo-borda); color:var(--ds-texto-inverso); }
.btn.ia { background:var(--ds-descoberta-fundo); color:var(--ds-descoberta-texto); }

.loz { display:inline-flex; align-items:center; gap:4px; max-width:208px; padding:2px 6px; border-radius:4px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; font-size:12px; line-height:16px; font-weight:600; }
.sucesso { background:var(--ds-sucesso-fundo); color:var(--ds-sucesso-texto); }
.alerta { background:var(--ds-alerta-fundo); color:var(--ds-alerta-texto); }
.perigo { background:var(--ds-perigo-fundo); color:var(--ds-perigo-texto); }
.info { background:var(--ds-info-fundo); color:var(--ds-info-texto); }
.neutro { background:var(--ds-neutro-fundo); color:var(--ds-neutro-texto); }
.descoberta { background:var(--ds-descoberta-fundo); color:var(--ds-descoberta-texto); }

.msg { display:flex; gap:12px; padding:16px; border-radius:4px; }
.msg b.ic { font-weight:700; }
.campo { display:grid; gap:4px; }
.campo label { font-size:12px; line-height:16px; font-weight:600; color:var(--ds-texto-sutil); }
.campo input, .campo select, .campo textarea { min-height:32px; padding:4px 8px; border-radius:4px; border:2px solid var(--ds-borda);
  background:var(--ds-superficie); }
.campo input:hover, .campo select:hover, .campo textarea:hover { border-color:var(--ds-borda-forte); }
.campo .ajuda { font-size:12px; line-height:16px; color:var(--ds-texto-mais-sutil); }
.form { display:grid; gap:12px; }

table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:12px; line-height:16px; font-weight:600; color:var(--ds-texto-sutil);
  border-bottom:2px solid var(--ds-borda); padding:8px; }
td { border-bottom:1px solid var(--ds-borda); padding:8px; vertical-align:middle; }
tr:hover td { background:var(--ds-fundo-neutro); }
.rolagem { overflow-x:auto; }
.num { text-align:right; font-variant-numeric:tabular-nums; }

.abas { display:flex; gap:4px; border-bottom:2px solid var(--ds-borda); margin-bottom:16px; overflow-x:auto; }
.abas span { padding:8px 12px; color:var(--ds-texto-sutil); font-weight:500; white-space:nowrap; margin-bottom:-2px; }
.abas span.ativa { color:var(--ds-link); border-bottom:2px solid var(--ds-link); }
.barra { height:8px; border-radius:4px; background:var(--ds-fundo-neutro); overflow:hidden; }
.barra i { display:block; height:100%; background:var(--ds-fundo-marca); }
.kpi .valor { font-size:24px; line-height:28px; font-weight:600; margin-top:4px; }

/* Árvore de desdobramento */
.arvore ul { list-style:none; margin:0; padding-left:24px; border-left:1px solid var(--ds-borda); }
.arvore > ul { padding-left:0; border-left:0; }
.arvore li { margin:8px 0; }
.no { display:inline-flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; border-radius:8px;
  background:var(--ds-superficie-elevada); box-shadow:var(--ds-sombra-elevada); }

/* Kanban */
.kanban { display:grid; grid-template-columns:repeat(5,minmax(200px,1fr)); gap:12px; overflow-x:auto; }
.coluna { background:var(--ds-fundo-neutro); border-radius:8px; padding:8px; display:grid; gap:8px; align-content:start; }
.coluna h3 { margin:4px 4px 0; }

/* Espinha de peixe 6M */
.espinha { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)) 180px; grid-template-rows:auto 40px auto; gap:8px 12px; align-items:stretch; }
.espinha .m { background:var(--ds-superficie-elevada); box-shadow:var(--ds-sombra-elevada); border-radius:8px; padding:8px 12px; }
.espinha .m ul { margin:4px 0 0; padding-left:18px; }
.espinha .eixo { grid-column:1 / 4; grid-row:2; align-self:center; height:4px; background:var(--ds-borda-forte); border-radius:2px; }
.espinha .cabeca-peixe { grid-column:4; grid-row:1 / 4; align-self:center; padding:12px; border-radius:8px; }
.raiz { font-weight:600; }

/* TV */
.tv { background:#0f1318; color:#eef1f5; border-radius:8px; padding:24px; }
.tv .grande { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }
.tv .bloco { border-radius:8px; padding:16px; background:#1b2129; }
.tv .bloco .v { font-size:36px; line-height:40px; font-weight:700; margin-top:8px; }

.chat { display:grid; gap:12px; }
.bolha { padding:12px; border-radius:8px; max-width:640px; }
.bolha.eu { background:var(--ds-fundo-selecionado); justify-self:end; }
.bolha.ia { background:var(--ds-superficie-elevada); box-shadow:var(--ds-sombra-elevada); }

@media (max-width: 900px) {
  .quadro { grid-template-columns:minmax(0,1fr); }
  .g2a, .g2b, .g2c { grid-template-columns:1fr; }
  nav.menu { display:none; }
  .seletor { display:block; padding:12px 16px 0; }
  .seletor select { width:100%; min-height:32px; border-radius:4px; border:2px solid var(--ds-borda); background:var(--ds-superficie); padding:4px 8px; }
  main { padding:16px; }
  .g2, .g3, .g4 { grid-template-columns:1fr; }
  .tv .grande { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .espinha { grid-template-columns:1fr; grid-template-rows:none; }
  .espinha .m { grid-row:auto !important; }
  .espinha .eixo { display:none; } .espinha .cabeca-peixe { grid-column:auto; grid-row:auto; }
  .topo .quem { display:none; }
}
</style>
</head>
<body>
<header class="topo">
  <span class="marca">Sistema de Gestão PDCA</span>
  <span class="loz info">Protótipo navegável</span>
  <span class="espaco"></span>
  <span class="quem">Ana · Núcleo de Atendimento</span>
  <button class="btn sut" id="tema" type="button" aria-label="Alternar tema claro e escuro">◐ Tema</button>
</header>
<div class="seletor"><label class="campo"><span class="peq sutil">Tela</span><select id="seletor" aria-label="Escolher tela"></select></label></div>
<div class="quadro">
  <nav class="menu" id="menu" aria-label="Telas por fatia"></nav>
  <main id="tela" tabindex="-1"></main>
</div>
<script>
// Dados fictícios. Cada tela cita a história da spec que a motiva; o que não for F00 é protótipo e muda com a spec aprovada.
const MESES = ["nov","dez","jan","fev","mar","abr","mai","jun","jul","ago","set","out"];
const FAROL = {
  verde: ["sucesso","✔","No alvo"], amarelo: ["alerta","!","Atenção"],
  vermelho: ["perigo","✖","Fora do alvo"], sem_dado: ["neutro","–","Sem dado"],
};
const IND = [
  { cod:"IND-01", nome:"Índice de satisfação do cliente", un:"%", meta:80, pol:"maior_melhor", farol:"vermelho",
    serie:[82,83,81,84,80,79,81,82,78,77,76,70.5], resp:"Ana" },
  { cod:"IND-02", nome:"Tempo médio de resposta", un:"h", meta:24, pol:"menor_melhor", farol:"amarelo",
    serie:[22,21,23,24,22,23,24,25,24,23,24,25], resp:"Carlos" },
  { cod:"IND-03", nome:"Chamados resolvidos no 1º contato", un:"%", meta:65, pol:"maior_melhor", farol:"verde",
    serie:[58,60,61,62,63,64,66,65,67,68,69,71], resp:"Ana" },
  { cod:"IND-04", nome:"Custo por atendimento", un:"R$", meta:38, pol:"menor_melhor", farol:"verde",
    serie:[41,40,40,39,39,38,37,37,36,36,35,35], resp:"Eva" },
  { cod:"IND-05", nome:"Absenteísmo da equipe", un:"%", meta:3, pol:"menor_melhor", farol:"sem_dado",
    serie:[2.8,3.1,2.9,2.5,2.7,3.0,2.6,2.4,2.9,3.2,2.8,null], resp:"Carlos" },
];
const num = (v) => v === null || v === undefined ? "—" : String(v).replace(".", ",");
const farol = (f) => `<span class="loz ${FAROL[f][0]}"><span aria-hidden="true">${FAROL[f][1]}</span>${FAROL[f][2]}</span>`;
const loz = (papel, texto) => `<span class="loz ${papel}">${texto}</span>`;
const btn = (texto, tipo = "") => `<button type="button" class="btn ${tipo}">${texto}</button>`;
const msg = (papel, icone, titulo, texto) =>
  `<div class="msg ${papel}" role="${papel === "perigo" || papel === "alerta" ? "alert" : "status"}"><b class="ic" aria-hidden="true">${icone}</b><div><p><b>${titulo}</b></p><p>${texto}</p></div></div>`;
const campo = (rotulo, valor = "", extra = {}) => {
  const id = "c" + Math.random().toString(36).slice(2, 8);
  const ajuda = extra.ajuda ? `<span class="ajuda">${extra.ajuda}</span>` : "";
  let ctl;
  if (extra.opcoes) ctl = `<select id="${id}">${extra.opcoes.map((o) => `<option${o === valor ? " selected" : ""}>${o}</option>`).join("")}</select>`;
  else if (extra.area) ctl = `<textarea id="${id}" rows="${extra.area}">${valor}</textarea>`;
  else ctl = `<input id="${id}" value="${valor}" ${extra.tipo ? `type="${extra.tipo}"` : ""}>`;
  return `<div class="campo"><label for="${id}">${rotulo}</label>${ctl}${ajuda}</div>`;
};
const tabela = (cab, linhas, numericas = []) => `<div class="rolagem"><table><thead><tr>${cab
  .map((c, i) => `<th${numericas.includes(i) ? ' class="num"' : ""}>${c}</th>`).join("")}</tr></thead><tbody>${linhas
  .map((l) => `<tr>${l.map((c, i) => `<td${numericas.includes(i) ? ' class="num"' : ""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
function serie(valores, meta, largura = 220, altura = 48) {
  const v = valores.filter((x) => x !== null), min = Math.min(...v, meta) * 0.95, max = Math.max(...v, meta) * 1.05;
  const x = (i) => (i / (valores.length - 1)) * (largura - 8) + 4, y = (n) => altura - 4 - ((n - min) / (max - min)) * (altura - 8);
  const pts = valores.map((n, i) => (n === null ? null : `${x(i).toFixed(1)},${y(n).toFixed(1)}`)).filter(Boolean).join(" ");
  const ult = valores.map((n, i) => [n, i]).filter(([n]) => n !== null).pop();
  return `<svg width="${largura}" height="${altura}" viewBox="0 0 ${largura} ${altura}" role="img" aria-label="Série de 12 meses; meta ${num(meta)}">
    <line x1="4" x2="${largura - 4}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--ds-borda-forte)" stroke-dasharray="4 3"/>
    <polyline points="${pts}" fill="none" stroke="var(--ds-fundo-marca)" stroke-width="2"/>
    <circle cx="${x(ult[1])}" cy="${y(ult[0])}" r="3.5" fill="var(--ds-fundo-marca)"/></svg>`;
}
const cartaoIndicador = (i, lancar = true) => `<article class="cartao">
  <div class="entre"><div><h2><span class="sutil">${i.cod}</span> · ${i.nome}</h2>
  <p class="sutil mt8">Meta: <span style="color:var(--ds-texto)">${num(i.meta)} ${i.un}</span> &nbsp; Valor em 10/2026:
  <span style="color:var(--ds-texto)">${i.serie[11] === null ? "sem lançamento" : num(i.serie[11]) + " " + i.un}</span></p></div>${farol(i.farol)}</div>
  ${lancar ? `<hr class="sep"><div class="linha" style="align-items:flex-end">${campo("Período", "outubro de 2026")}${campo("Valor", "")}${btn("Lançar", "pri")}</div>` : ""}
</article>`;

const TELAS = [
  // F00 — implementadas

const NOMES_FATIA = { F00:"Esqueleto andante", F01:"Meta e farol", F02:"Desdobramento e aceite", F03:"Anomalia e plano",
  F04:"Rotina SDCA", F05:"Rituais e atas", F06:"API e Jira", F07:"MCP de leitura", F08:"Diagnóstico", F09:"IA sugere", F10:"Escala" };
const menu = document.getElementById("menu"), seletor = document.getElementById("seletor"), area = document.getElementById("tela");
let grupo = "";
for (const t of TELAS) {
  if (t.f !== grupo) {
    grupo = t.f;
    menu.insertAdjacentHTML("beforeend", `<div class="grupo">${t.f} · ${NOMES_FATIA[t.f]}</div>`);
    seletor.insertAdjacentHTML("beforeend", `<optgroup label="${t.f} · ${NOMES_FATIA[t.f]}"></optgroup>`);
  }
  menu.insertAdjacentHTML("beforeend", `<a href="#${t.id}"><span>${t.nome}</span><span class="ponto${t.real ? " real" : ""}" title="${t.real ? "Implementada" : "Protótipo"}"></span></a>`);
  seletor.lastElementChild.insertAdjacentHTML("beforeend", `<option value="${t.id}">${t.nome}</option>`);
}
function mostrar() {
  const t = TELAS.find((x) => "#" + x.id === location.hash) || TELAS[0];
  menu.querySelectorAll("a").forEach((a) => { if (a.getAttribute("href") === "#" + t.id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  seletor.value = t.id;
  area.innerHTML = `<div class="faixa">${t.real ? loz("sucesso","Implementada") : loz("info","Protótipo")}<span>${t.hist}</span>
    <span>· ${t.real ? "equivalente à tela do sistema (make up → localhost:3000)" : "dados fictícios; o desenho final segue a spec aprovada"}</span></div>
    <div class="cabeca"><div><h1>${t.titulo}</h1>${t.sub ? `<p class="sub">${t.sub}</p>` : ""}</div>${t.acoes ? `<div class="linha">${t.acoes}</div>` : ""}</div>${t.html()}`;
  document.title = `${t.nome} · Protótipo PDCA`;
}
seletor.addEventListener("change", () => (location.hash = seletor.value));
addEventListener("hashchange", () => { mostrar(); area.focus(); });
document.getElementById("tema").addEventListener("click", () => {
  const raiz = document.documentElement, escuro = raiz.dataset.theme ? raiz.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  raiz.dataset.theme = escuro ? "light" : "dark";
  try { localStorage.setItem("tema-prototipo", raiz.dataset.theme); } catch {}
});
try { const salvo = localStorage.getItem("tema-prototipo"); if (salvo) document.documentElement.dataset.theme = salvo; } catch {}
mostrar();
</script>
